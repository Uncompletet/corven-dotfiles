<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer><family>OpenDyslexic</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>OpenDyslexic</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>OpenDyslexic Mono</family></prefer>
  </alias>
</fontconfig>
